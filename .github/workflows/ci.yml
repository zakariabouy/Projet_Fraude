name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests (cost function, features, metrics, API)
        run: pytest
      - name: End-to-end smoke run on synthetic data
        run: python -m src.train --synthetic --output-dir artifacts/smoke --no-mlflow --n-trials 3 --bootstrap 100

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Make sure a model exists (synthetic one if none is committed)
        run: |
          if [ ! -f models/fraud_model.joblib ]; then
            pip install -r requirements-train.txt
            python -m src.train --synthetic --no-mlflow --n-trials 3 --bootstrap 100
          fi
      - run: docker build -t fraud-api .
      - name: Run the container and call the API
        run: |
          docker run -d --name api -p 8000:8000 fraud-api
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" -d @examples/transaction_fraud.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' -d '{"Amount": -1}')" = "422"
      - if: always()
        run: docker logs api || true
