[project]
name = "fraud-detection"
version = "1.0.0"
description = "Cost-sensitive credit card fraud detection: from data to decision, in production."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Zakariae Bouyaknifen" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "mlruns", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501"]  # the formatter owns line length; long f-strings in reports are fine

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]  # FastAPI's dependency-injection idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
